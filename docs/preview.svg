<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="一只红色小螃蟹，旁边浮着记忆卡、日记本、月亮和声波">
  <defs>
    <radialGradient id="kaka-glow" cx="30%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#E4573C" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#E4573C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kaka-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7EFE6" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#F7EFE6" stop-opacity="0.86"/>
    </linearGradient>
    <linearGradient id="kaka-stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E2A28" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#2E2A28" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="640" height="300" fill="none"/>
  <ellipse cx="200" cy="140" rx="200" ry="150" fill="url(#kaka-glow)"/>

  <!-- 落脚的石台 -->
  <ellipse cx="190" cy="246" rx="126" ry="22" fill="url(#kaka-stone)"/>

  <!-- 螃蟹本体（内嵌位图） -->
  <image x="86" y="98" width="200" height="200" href="data:image/png;base64,"/>

  <!-- 声波 -->
  <g fill="none" stroke="#E4573C" stroke-linecap="round">
    <path d="M 292 168 q 18 -14 36 0" stroke-width="5" opacity="0.85"/>
    <path d="M 300 190 q 26 -22 52 0" stroke-width="4" opacity="0.55"/>
    <path d="M 308 212 q 34 -30 68 0" stroke-width="3" opacity="0.30"/>
  </g>

  <!-- 记忆卡 -->
  <g transform="translate(392 84)">
    <rect x="0" y="0" width="120" height="76" rx="14" fill="url(#kaka-card)" stroke="#2E2A28" stroke-opacity="0.12"/>
    <rect x="14" y="16" width="22" height="16" rx="4" fill="#E4573C" opacity="0.85"/>
    <rect x="14" y="40" width="60" height="6" rx="3" fill="#2E2A28" opacity="0.22"/>
    <rect x="14" y="52" width="44" height="6" rx="3" fill="#2E2A28" opacity="0.16"/>
    <rect x="86" y="16" width="20" height="40" rx="6" fill="#7C9A8E" opacity="0.55"/>
  </g>

  <!-- 日记本 -->
  <g transform="translate(408 182)">
    <rect x="0" y="0" width="108" height="72" rx="12" fill="url(#kaka-card)" stroke="#2E2A28" stroke-opacity="0.12"/>
    <rect x="0" y="0" width="14" height="72" rx="12" fill="#7C9A8E" opacity="0.45"/>
    <rect x="26" y="18" width="66" height="5" rx="2.5" fill="#2E2A28" opacity="0.22"/>
    <rect x="26" y="32" width="52" height="5" rx="2.5" fill="#2E2A28" opacity="0.16"/>
    <rect x="26" y="46" width="60" height="5" rx="2.5" fill="#2E2A28" opacity="0.12"/>
  </g>

  <!-- 月亮与梦 -->
  <g transform="translate(522 74)">
    <circle cx="0" cy="0" r="26" fill="#F4E3B2"/>
    <circle cx="12" cy="-7" r="24" fill="#F7EFE6" opacity="0.92"/>
    <circle cx="20" cy="26" r="3" fill="#7C9A8E" opacity="0.7"/>
    <circle cx="32" cy="34" r="2.2" fill="#7C9A8E" opacity="0.55"/>
    <circle cx="42" cy="40" r="1.6" fill="#7C9A8E" opacity="0.4"/>
  </g>

  <!-- 虚线：三件事连到螃蟹 -->
  <g fill="none" stroke="#2E2A28" stroke-opacity="0.18" stroke-dasharray="4 7" stroke-width="1.6">
    <path d="M 296 132 q 40 -10 88 -12"/>
    <path d="M 300 216 q 44 6 100 -6"/>
    <path d="M 300 150 q 90 -56 196 -58"/>
  </g>
</svg>
